"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "scripts/setup.sh"
run_mode = "concurrent"

[scripts.run.dev]
# Local (Mac): localhost on $CONDUCTOR_PORT. Cloud: no CONDUCTOR_PORT, so 5173 on all
# interfaces; share it with `conductor preview set --port 5173`.
# An empty EXTERNAL_ANTHROPIC_API_KEY in the environment would shadow app/.env, so drop it.
command = "cd app && { [ -n \"${EXTERNAL_ANTHROPIC_API_KEY:-}\" ] || unset EXTERNAL_ANTHROPIC_API_KEY; } && if [ \"${CONDUCTOR_IS_LOCAL:-1}\" = 0 ]; then export __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.conductor.show; HOST=0.0.0.0; else HOST=localhost; fi && npm run dev -- --host $HOST --port ${CONDUCTOR_PORT:-5173}"
default = true
icon = "play"

[scripts.run.test]
command = ".venv/bin/python -m pytest -q pipeline/tests && cd app && npm run check"
icon = "test-tube"

[scripts.run.data]
command = "scripts/build-data.sh"
icon = "database"

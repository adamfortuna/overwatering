"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "scripts/setup.sh"
run_mode = "concurrent"

[scripts.run.dev]
# Cloud workspaces have no CONDUCTOR_PORT: use 5173 and share it with `conductor preview set --port 5173`.
command = "cd app && __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.conductor.show npm run dev -- --host 0.0.0.0 --port ${CONDUCTOR_PORT:-5173}"
default = true
icon = "play"

[scripts.run.test]
command = ".venv/bin/python -m pytest -q pipeline/tests && cd app && npm run check"
icon = "test-tube"

[scripts.run.data]
command = "scripts/build-data.sh"
icon = "database"

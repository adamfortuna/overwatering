"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "scripts/setup.sh"
run_mode = "concurrent"

[scripts.run.dev]
# scripts/dev.sh: picks a new-enough Node (nvm/.nvmrc), installs app deps if missing, then
# serves on localhost:$CONDUCTOR_PORT locally or 0.0.0.0:5173 in the cloud.
command = "scripts/dev.sh"
default = true
icon = "play"

[scripts.run.test]
command = "scripts/test.sh"
icon = "test-tube"

[scripts.run.data]
command = "scripts/build-data.sh"
icon = "database"

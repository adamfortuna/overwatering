    <script>
              const tooltip = document.getElementById('tooltip');

              let activeCounty = null;

              // ---- Helper functions ----
              function setActiveCounty(el) {
                if (activeCounty && activeCounty !== el) {
                  activeCounty.classList.remove('county-active');
                }
                el.classList.add('county-active');
                activeCounty = el;
              }

              function clearActiveCounty(el) {
                if (activeCounty === el) {
                  el.classList.remove('county-active');
                  activeCounty = null;
                }
              }

              function hideTooltip() {
                tooltip.style.display = 'none';
              }

              // ---- MOUSE HOVER ----
              document.addEventListener('mouseenter', function(e) {
                if (e.target.classList.contains('county')) {
                  setActiveCounty(e.target);
                }
              }, true);

              document.addEventListener('mousemove', function(e) {
                if (e.target.classList.contains('county')) {
                  const mouseBuffer = 15;
                  tooltip.style.display = 'block';
                  tooltip.style.left = (e.pageX + mouseBuffer) + 'px';
                  tooltip.style.top  = (e.pageY + mouseBuffer) + 'px';
                  tooltip.style.transform = 'none'; // clear focus transform
                }
              });

              document.addEventListener('mouseleave', function(e) {
                if (e.target.classList.contains('county')) {
                  clearActiveCounty(e.target);
                  hideTooltip();
                }
              }, true);

              // ---- KEYBOARD FOCUS ----
              document.addEventListener('focusin', function(e) {
                if (e.target.classList.contains('county')) {
                  setActiveCounty(e.target);

                  const rect = e.target.getBoundingClientRect();
                  const centerX = rect.left + (rect.width / 2);
                  const centerY = rect.top + (rect.height / 2);

                  const yOffset = -35; 
                  const xOffset = 65;

                  tooltip.style.display = 'block';
                  tooltip.style.left  = (centerX + window.scrollX + xOffset) + 'px';
                  tooltip.style.top   = (centerY + window.scrollY + yOffset) + 'px';
                  tooltip.style.transform = 'translate(-50%, -50%)';
                }
              });

              document.addEventListener('focusout', function(e) {
                if (e.target.classList.contains('county')) {
                  clearActiveCounty(e.target);
                  hideTooltip();
                }
              });
            </script>
